# Groups of equivalent markets across platforms.
#
# Each group is one real-world question; each member points at that same
# question on a different platform. IDs below are PLACEHOLDERS -- find the
# real ones for markets you care about with:
#
#   python scripts/list_markets.py polymarket "wnba"
#   python scripts/list_markets.py kalshi "wnba"
#   python scripts/list_markets.py predictit "wnba"
#   python scripts/list_markets.py manifold "wnba"
#
# then replace the params below with the slug/ticker/market_id you find.
# Only group markets that truly share the same resolution criteria and
# deadline -- a mismatch here will look like a juicy "edge" that isn't real.
#
# Note: PredictIt only lists political/economic markets, never sports, so
# it won't have a WNBA equivalent -- leave it out of sports groups entirely
# rather than guessing at an ID. Kalshi's sports coverage varies by state/
# season, so check with list_markets.py before assuming it has one either.

groups:
  - name: wnba-champion-example
    members:
      - source: polymarket
        params:
          slug: wnba-champion-2026
      - source: manifold
        params:
          slug: which-team-will-win-the-2026-wnba-finals
